<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 648 344" width="648" height="344" role="img" aria-labelledby="name">
  <title id="name">Rounded vector phone and traffic signal</title>
  <defs>
    <linearGradient id="metal" x1="0" x2="1" y1="0" y2=".8" gradientUnits="objectBoundingBox">
      <stop stop-color="#526a71"/>
      <stop offset=".3" stop-color="#273e46"/>
      <stop offset="1" stop-color="#10252e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2=".65" y1="0" y2="1">
      <stop stop-color="#f2fbf7"/>
      <stop offset="1" stop-color="#cde4e0"/>
    </linearGradient>
    <linearGradient id="dark-glass" x2="0" y2="1">
      <stop stop-color="#122129"/>
      <stop offset="1" stop-color="#465a5b"/>
    </linearGradient>
    <radialGradient id="green-lens" cx=".42" cy=".33" r=".7">
      <stop stop-color="#b9f8ce"/>
      <stop offset=".53" stop-color="#56dba1"/>
      <stop offset="1" stop-color="#1d956c"/>
    </radialGradient>
    <linearGradient id="pole" x2="1" y2="0">
      <stop stop-color="#38525a"/>
      <stop offset="1" stop-color="#132b32"/>
    </linearGradient>
    <radialGradient id="contact-shadow">
      <stop stop-color="#163741" stop-opacity=".27"/>
      <stop offset="1" stop-color="#163741" stop-opacity="0"/>
    </radialGradient>
    <g id="lens">
      <circle r="25" fill="#0b1c24" stroke="#50666a" stroke-width="1.25"/>
      <circle r="19" fill="url(#dark-glass)" stroke="#121f23" stroke-width="1.25"/>
      <path d="M-24 1a24 24 0 0 1 48 0" fill="none" stroke="#445a60" stroke-width="4" stroke-linecap="round"/>
      <path d="M-17-6a18 18 0 0 1 24-12" fill="none" stroke="#ffffff" stroke-opacity=".13" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </defs>

  <g id="phone" transform="translate(88 25)">
    <ellipse cx="79" cy="290" rx="104" ry="21" fill="url(#contact-shadow)"/>
    <rect x="-2" y="62" width="6" height="33" rx="3" fill="#36525a"/>
    <rect x="155" y="77" width="6" height="42" rx="3" fill="#19333c"/>
    <rect width="159" height="281" rx="29" fill="url(#metal)" stroke="#16323c" stroke-width="2"/>
    <rect x="7" y="7" width="145" height="267" rx="22" fill="url(#glass)" stroke="#152e37" stroke-width="2"/>
    <path d="M13 27Q13 12 27 12H125" fill="none" stroke="#ffffff" stroke-opacity=".8" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="55" y="13" width="49" height="14" rx="7" fill="#193640"/>
    <circle cx="96" cy="20" r="2.4" fill="#65958f"/>
    <g fill="#27454a">
      <path d="M35 21h4m-8 0h1m-5 0h1" fill="none" stroke="#27454a" stroke-width="2" stroke-linecap="round"/>
      <rect x="116" y="17" width="15" height="8" rx="2" fill="none" stroke="#27454a" stroke-width="1.25"/>
      <rect x="118" y="19" width="10" height="4" rx="1.5"/>
    </g>
    <circle cx="27" cy="59" r="8" fill="#76aa9e"/>
    <path d="M43 55h43m-43 8h29" stroke="#739990" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M17 82h125" stroke="#a5c5bf" stroke-width="1"/>
    <g id="message-left">
      <path d="M31 96h74a10 10 0 0 1 10 10v23a10 10 0 0 1-10 10H31l-9 6v-39a10 10 0 0 1 9-10Z" fill="#ffffff" stroke="#c1d9d3" stroke-width="1"/>
      <path d="M33 111h59m-59 13h38" stroke="#678883" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="message-right">
      <path d="M64 154h61a10 10 0 0 1 10 10v32l-9-6H64a10 10 0 0 1-10-10v-16a10 10 0 0 1 10-10Z" fill="#266454"/>
      <path d="M66 169h52m-52 9h31" stroke="#c0e4d6" stroke-width="3" stroke-linecap="round"/>
    </g>
    <rect x="21" y="227" width="117" height="26" rx="13" fill="#edf7f3" stroke="#a5c5bf" stroke-width="1"/>
    <path d="M32 240h37m43 0h13" stroke="#71978e" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M58 264h43" stroke="#3d5c62" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g id="traffic-signal" transform="translate(474 26)">
    <ellipse cy="286" rx="93" ry="20" fill="url(#contact-shadow)"/>
    <rect x="-10" y="209" width="20" height="73" rx="7" fill="url(#pole)"/>
    <rect x="-27" y="272" width="54" height="10" rx="5" fill="#29464b"/>
    <rect x="-54" width="108" height="220" rx="29" fill="url(#metal)" stroke="#132b34" stroke-width="2"/>
    <rect x="-47" y="7" width="94" height="206" rx="23" fill="#19313a" stroke="#597175" stroke-width="1.4"/>
    <path d="M-40 31Q-40 14-22 14H20" fill="none" stroke="#729194" stroke-width="1.8" stroke-linecap="round"/>
    <use xlink:href="#lens" transform="translate(0 47)"/>
    <use xlink:href="#lens" transform="translate(0 110)"/>
    <use xlink:href="#lens" transform="translate(0 173)"/>
    <g id="green-on" transform="translate(0 173)">
      <circle r="27" fill="#70dfa2" opacity=".12"/>
      <circle r="18" fill="url(#green-lens)" stroke="#63d795" stroke-width="1"/>
      <path d="M-13-5a13 13 0 0 1 16-8" fill="none" stroke="#e4ffee" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/>
      <path d="M-8 9h16m-18-5h20m-21-5h22" stroke="#e9fff0" stroke-opacity=".22" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </g>
</svg>
