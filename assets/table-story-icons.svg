<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 112" width="448" height="112" role="img" aria-labelledby="title">
  <title id="title">Four rounded icons for geography, time, cooking heat and a shared table</title>
  <defs>
    <linearGradient id="jade" x2="0" y2="1"><stop stop-color="#e5f4eb"/><stop offset="1" stop-color="#b9dfd2"/></linearGradient>
    <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff4cf"/><stop offset="1" stop-color="#f6d98a"/></linearGradient>
    <linearGradient id="red" x2="0" y2="1"><stop stop-color="#ffe9dc"/><stop offset="1" stop-color="#f6bfb0"/></linearGradient>
    <linearGradient id="blue" x2="0" y2="1"><stop stop-color="#eef1ff"/><stop offset="1" stop-color="#c8d1ef"/></linearGradient>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g id="geography">
      <rect x="8" y="12" width="96" height="94" rx="25" fill="#20685f" opacity=".13"/>
      <rect x="8" y="8" width="96" height="94" rx="25" fill="url(#jade)" stroke="#8fc9ba" stroke-width="1.5"/>
      <path d="M23 73l16-16 11 9 16-15 23 22" stroke="#20685f" stroke-width="3"/>
      <path d="M27 80h58" stroke="#4b8b80" stroke-width="2"/>
      <path d="M57 60c-6-7-12-13-12-21a13 13 0 0 1 26 0c0 8-6 14-12 21a1.3 1.3 0 0 1-2 0Z" fill="#20685f"/>
      <circle cx="58" cy="39" r="4.5" fill="#eeb649"/>
    </g>
    <g id="time" transform="translate(112)">
      <rect x="8" y="12" width="96" height="94" rx="25" fill="#825012" opacity=".13"/>
      <rect x="8" y="8" width="96" height="94" rx="25" fill="url(#gold)" stroke="#e5b64d" stroke-width="1.5"/>
      <circle cx="56" cy="55" r="28" fill="#fff9e8" stroke="#825012" stroke-width="3"/>
      <path d="M56 33v3m22 19h-3M56 77v-3M34 55h3" stroke="#ad7627" stroke-width="2.3"/>
      <path d="M56 42v14l10 6" stroke="#825012" stroke-width="3.4"/>
      <circle cx="56" cy="55" r="3" fill="#bf4c37"/>
    </g>
    <g id="cooking-heat" transform="translate(224)">
      <rect x="8" y="12" width="96" height="94" rx="25" fill="#91372c" opacity=".13"/>
      <rect x="8" y="8" width="96" height="94" rx="25" fill="url(#red)" stroke="#e3a392" stroke-width="1.5"/>
      <path d="M27 61h45c-2 14-11 21-22 21S31 75 27 61Z" fill="#91372c" stroke="#91372c" stroke-width="2"/>
      <path d="M69 63l16-10" stroke="#91372c" stroke-width="5"/>
      <path d="M45 66h18" stroke="#efb094" stroke-width="2"/>
      <path d="M50 54c-9-3-10-11-4-16 0 4 2 4 4 3 3-3 4-8 4-12 7 6 13 15 8 21-3 5-8 6-12 4Z" fill="#b6382c"/>
      <path d="M51 51c-2-2-1-5 3-8 1 3 4 4 3 6-1 3-4 4-6 2Z" fill="#ffd478"/>
