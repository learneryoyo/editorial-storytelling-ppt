<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" role="img" aria-labelledby="title desc">
  <title id="title">山水、时间、火候与同桌</title>
  <desc id="desc">四组墨线与平涂插图，分别描绘山间田畦、漏下的一粒沙、锅中跃起的火和伸向同一盘菜的两双筷子。</desc>
  <g fill="none" stroke="#2a2522" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <g id="geography">
      <!-- The hillside is a loose paper silhouette. The ink traces a different edge. -->
      <path d="M29 121 64 73 85 91 119 56 170 126 151 143 44 144Z" fill="#6c9a8a" stroke="none"/>
      <path d="M139 49c13-5 25 2 27 13 3 11-4 21-14 23-13 3-24-5-25-16-1-9 4-16 12-20Z" fill="#daa34c" stroke="none"/>
      <path d="M30 126c13-15 23-33 36-48l21 20c10-10 21-24 30-33 15 16 27 37 43 53"/>
      <path d="M91 111c10-10 19-18 27-22m-2 9c9 4 17 9 22 14" stroke-width="2.8"/>
      <path d="M45 129c23 2 52-1 79-12m-71 23c34 0 62-3 91-13m-70 24c30 0 62-7 85-19" stroke-width="2.8"/>
    </g>

    <g id="time" transform="translate(200)">
      <!-- One falling grain connects the two shallow piles. -->
      <path d="M57 42 129 41c1 10-5 24-15 34L99 90c-5 4-5 10 1 15l18 16c9 9 12 20 13 28l-77 2c0-13 7-23 17-31l17-15c6-5 7-10 1-16L72 75c-10-9-15-20-15-33Z" fill="#f3e6cb" stroke="none"/>
      <path d="M66 61c13 3 36 0 54-1-4 9-11 16-21 24-3 3-6 3-10 0C78 75 72 70 66 61Zm2 78c9-5 17-13 24-19 4-4 7-3 11 1 8 9 17 13 24 17l2 10-68 1Z" fill="#d6a147" stroke="none"/>
      <path d="M52 44c23-1 54-2 83-1M52 151c25-2 57-2 85-1"/>
      <path d="M59 47c-1 18 10 28 27 42 7 6 7 11 0 17-20 16-26 25-26 41m68-101c1 18-10 28-27 43-7 6-7 11 0 17 18 17 28 27 28 41"/>
      <circle cx="94" cy="108" r="2.4" fill="#2a2522" stroke="none"/>
      <path d="M147 75l7-4m-5 16 11-1" stroke-width="2.7"/>
    </g>

    <g id="cooking-heat" transform="translate(400)">
      <!-- A flame-shaped patch and lifted ingredients carry the motion. -->
      <path d="M72 116c-16-9-23-22-14-37 4 7 11 8 15 4 7-7 3-19 17-35 0 12 6 16 11 23 5-10 11-15 18-19-3 12 8 22 10 33 4 18-11 29-26 32Z" fill="#c66e55" stroke="none"/>
      <path d="M38 121c22 3 53 3 90 0-9 16-25 28-45 28-19 1-33-9-45-28Z" fill="#f3e6cb" stroke="none"/>
      <path d="M35 117c27 5 61 5 92 0 10-2 21-7 34-15 6-4 9 2 4 6-12 8-23 13-34 16"/>
      <path d="M38 121c11 15 27 26 46 26 21-1 35-11 45-24"/>
      <path d="M69 103c-4-6-4-13 1-19m23 21c7-12 8-21 3-31"/>
      <path d="m46 84 7-15 15 6-7 14Z" fill="#d6a147" stroke="none"/>
      <path d="M112 65c1-12 10-18 21-18-4 10-8 15-21 18Z" fill="#739682" stroke="none"/>
      <path d="M126 71l10-5m-98 31 8-1" stroke-width="2.8"/>
    </g>

    <g id="shared-table" transform="translate(600)">
      <!-- Two sets of chopsticks converge on one dish, with room around the gesture. -->
      <path d="M49 91c3-23 25-39 53-39 29-1 53 20 54 47 2 26-23 47-49 48-30 1-57-13-59-40-1-5 0-11 1-16Z" fill="#8090a8" stroke="none"/>
      <path d="M65 115c14 15 56 18 74-7 11-16 0-39-19-44" stroke="#f6ecdd" stroke-width="3"/>
      <path d="M120 132c-28 8-62-1-67-25-7-27 17-49 47-51 29-1 53 18 52 43-1 8-4 16-10 22"/>
      <path d="M93 111c-8-5-9-13-3-19 4-4 9-4 13 0 5-6 12-5 15-1 6 9-3 19-13 23-5 2-9 0-12-3Z" fill="#e5aa54" stroke="none"/>
      <path d="M34 40c20 14 43 32 61 57m-51-64c20 17 39 35 56 59"/>
      <path d="M169 158c-16-18-34-34-56-49m46 56c-15-18-32-36-50-51"/>
      <path d="M20 45c4 0 8 2 12 5m128 99c8-1 13 2 17 7" stroke-width="2.7"/>
    </g>
  </g>
