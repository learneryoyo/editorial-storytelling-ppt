      <rect x="8" y="8" width="96" height="94" rx="25" fill="url(#blue)" stroke="#aab9e8" stroke-width="1.5"/>
      <circle cx="56" cy="55" r="21" fill="#f5f6ff" stroke="#334e8a" stroke-width="3"/>
      <circle cx="56" cy="55" r="8" fill="#efb84c" stroke="#334e8a" stroke-width="2"/>
      <circle cx="56" cy="27" r="4.5" fill="#334e8a"/>
      <circle cx="56" cy="83" r="4.5" fill="#334e8a"/>
      <circle cx="28" cy="55" r="4.5" fill="#334e8a"/>
      <circle cx="84" cy="55" r="4.5" fill="#334e8a"/>
